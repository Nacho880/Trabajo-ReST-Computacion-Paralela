[pytest]
# Suprime ÚNICAMENTE el warning interno de Starlette sobre la futura
# migración de `httpx` a `httpx2` dentro de `starlette.testclient`
# (usado por `fastapi.testclient.TestClient` en los tests de la API).
#
# Es un aviso de mantenimiento interno de una dependencia de terceros
# (Starlette), no un problema del código de este proyecto ni algo que
# esté bajo nuestro control corregir. Se filtra por mensaje y categoría
# exactos (sin restringir el módulo: Python atribuye el warning a quien
# HACE el `import` — `fastapi.testclient` — no al archivo donde vive el
# `warnings.warn(...)` real, así que restringir por módulo es frágil).
# El patrón busca "httpx2" en cualquier parte del mensaje en vez de
# depender de que coincida el texto completo carácter por carácter
# (backticks/espacios pueden variar entre versiones de Starlette).
filterwarnings =
    ignore:.*httpx2.*
